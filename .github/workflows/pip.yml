name: Pip

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    name: Build with Pip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The version comes from the tags
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and install
        run: pip install --verbose . pytest pytest-benchmark numpy

      - name: Test
        run: python -m pytest
